# configs/design.yaml - THE single source of the experimental grid (PRD §R0.1).
#
# "No grid may be defined anywhere else." `msat validate-config` enforces that by
# grepping every other YAML in configs/ for `K_grid` / `B_grid` / `scales` /
# `readers` keys and failing non-zero if one turns up. A second definition is not
# a style violation - it is how a figure ends up describing two different
# experiments.
#
# `msat design-power configs/design.yaml` reads this file to answer, before a
# single API call: is the K x B INTERACTION estimable at this cell count?

schema_version: 1

# Retrieval depth K. A doubling grid: 6 points spanning 5 orders of magnitude.
# PRD §R9.4 - K_delta is defined on the ACTUAL grid and normalised by step
# position, because `A(K+1) - A(K) <= 0.5pp` is invalid on a doubling grid
# (it compares a 1x step against 2x steps and fires far too early).
#
# TRIMMED FROM 64 ON 2026-10-13. `build-plan` rejects K=64 as fully degenerate on
# the S scale: S questions hold a median of 48 sessions (max 62), so "retrieve the top
# 64" returns the ENTIRE conversation for 100% of them - P1 measured
# `frac_k_gt_corpus = 1.0`. The condition measures nothing about retrieval depth.
# 64 declared meant every `build-plan` run rejected 3 cells to say so; the grid now
# matches what can actually run. 126 cells -> 108.
K_grid: [1, 2, 4, 8, 16, 32]

# Context budget B. The MODE travels with each level (PRD §R1.7): mixing absolute
# and relative budgets silently invalidates the interaction, because 4096 tokens
# is a very different fraction of a 3 M-character corpus than of a 300 K-character
# one.
#
# MODE CHANGED 2026-10-13: absolute_tokens -> per_memory_tokens.
#
# This is not a preference. Under `absolute_tokens` the prompt is
# min(content(K), B) - the budget is a CUTOFF ON K expressed in tokens, so K and B
# are the same axis in different units. The number of ACTIVE budget levels at
# depth K is then monotone in K, which produces a staircase: a budget below
# content(1) is active at every K and collapses them all; a budget above
# content(64) is inert at every K and collapses them all. That staircase provably
# cannot exceed 2 distinct outcomes at K=1 and K=2 for ANY choice of values -
# verified over three candidate grids. 78 of 126 cells rendered a byte-identical
# prompt to another cell, leaving 48 distinct conditions from 126 declared ones.
#
# An axis that cannot vary independently cannot carry an interaction, and the
# K x B interaction is the whole claim of this design.
#
# Under `per_memory_tokens` the prompt is min(K, sessions) x min(mean_memory, B),
# which scales WITH K. Doubling K doubles the prompt at any budget, and changing B
# changes the density of what is shown without changing how many memories were
# retrieved. The crossing is then real.
#
# It is also the more meaningful manipulation: "retrieve 16 memories and show the
# first 512 tokens of each" is a genuinely different strategy from "retrieve 4
# memories and show all of them". Truncating the concatenated list cannot express
# that difference - it produces the same prompt for both.
#
# The values sit BELOW the measured mean memory length (~2,563 tokens on both
# scales, from P1) on purpose. A budget at or above the mean is inert, because
# truncating a memory to its own length is a no-op.
#
# RECAPPED 128/512/2048 -> 128/256/512 ON 2026-10-14, BECAUSE OF THE HARDWARE.
#
# The previous max prompt is min(32 sessions) x 2048 tokens = 65,536 tokens.
# Against the measured VRAM ceilings on the RTX 4060 (8 GB):
#
#   reader   ceiling      worst prompt  margin
#   gemma     66,160        65,536      624 tokens = 0.9%   <- primary
#   phi       44,318        65,536      BLOCKED, short 21,218
#   qwen      20,889        65,536      BLOCKED, short 44,647
#
# `msat design-power` confirmed: "6 cell(s) exceed their reader's window."
#
# Three things were wrong with running that on this card:
#
# 1. **0.9% margin on the primary reader is not a plan.** A run that OOMs at
#    hour 60 of 218 loses the whole sweep, and R5.2's resume re-enters the same
#    allocation. The margin also depends on `headroom_gb`, which is STILL AN
#    OPEN DECISION (D11: 0.8 GB gives gemma 66,160; 3.0 GB gives 36,326). At
#    3.0 GB the deepest cells are infeasible for the primary reader too. The
#    design cannot rest on a constant that has not been measured.
# 2. **A partial factorial is a weaker claim.** R4.4 says every cell in
#    K_grid x B_grid is a distinct condition. 6 rejected cells means reporting
#    an unbalanced design and explaining the holes.
# 3. **It is not free.** The bigger prompts made the sweep 217.7 h instead of
#    182.5 h.
#
# WHAT THIS COSTS, MEASURED (not estimated):
#
#   B_grid                span log2(B)   MDE (interaction)     infeasible   compute
#   [128, 512, 2048]           4.0          0.1158 pp             6          217.7 h
#   [128, 256,  512]           2.0          0.2662 pp             0          182.5 h
#
# 2.3x worse MDE. Both are ~40x smaller than the effect we are trying to
# detect: 2503.04388 reports -20% from more documents at fixed length, and
# 2608.15008 reports a -32% sign flip. A design that measures 0.27 pp has
# ample power for either. A design that OOMs at hour 60 has none.
#
# **Reliability was chosen over precision, deliberately and with the numbers
# above.** If this card is replaced with a 24 GB one, restoring 2048 buys
# 0.15 pp of precision that the paper does not need - and B is the wrong axis
# to spend the hardware on, because K is the one the field holds fixed.
#
# 128 / 256 / 512 = 5% / 10% / 20% of the measured mean memory length (2,563
# tokens, P1). The whole band sits BELOW the mean, where truncation actually
# does something: a budget at or above the mean is inert.
B_grid:
  - value: 128
    mode: per_memory_tokens
  - value: 256
    mode: per_memory_tokens
  - value: 512
    mode: per_memory_tokens

scales: [S, M]

# Three local reader families. PRD §R7.5 requires >= 2; three are declared.
# See `readers.yaml` for the pinned checkpoints and the VRAM ceiling that actually
# binds (the declared context window does not).
readers: [gemma, qwen, phi]

items:
  # Abstention items stay in end-to-end accuracy and are scored by the
  # benchmark's own rule; they are excluded from recall@K (PRD §R8.4).
  include_abstention: true
  limit: null  # null = all 500. Not a PRD §R1.1 null - that rule covers retrieval.yaml.

# Runs per cell. PRD §R7.4: this is reviewer question #2, so the rationale is
# recorded in decoding.yaml next to the noise floor it has to clear.
runs_per_cell: 3

seed: 20261012

# The one (K, B) a marginal single-factor sweep would centre on - i.e. what the
# four papers that hold depth fixed are implicitly running. Recorded so the
# interaction can be described as a departure from it.
reference:
  K: 16
  B: 1024
